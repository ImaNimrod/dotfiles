term=xterm-256color

font=Mononoki Nerd Font:size=16
font-bold=Mononoki Nerd Font:style=Bold:size=16
font-italic=Mononoki Nerd Font:style=Italic:size=16
font-bold-italic=Mononoki Nerd Font:style=Bold Italic:size=16

bold-text-in-bright=no
letter-spacing=0
dpi-aware=no

include=~/.config/foot/colors.ini

[scrollback]
lines=10000

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
